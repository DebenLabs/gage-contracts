# The compiler settings this release was deployed with. Each contract compiles under the profile its path
# restricts it to, so `forge build` reproduces the deployed creation and runtime bytecode: script/reproduce.mjs
# checks it. CBOR metadata is off, so comments and licence lines do not reach the bytecode.
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1_000_000
via_ir = false
bytecode_hash = "none"
cbor_metadata = false
additional_compiler_profiles = [
    { name = "v2-native", optimizer_runs = 200, via_ir = true },
    { name = "hybrid", optimizer_runs = 200, via_ir = true },
]
compilation_restrictions = [
    { paths = "src/v2/**", optimizer_runs = 200, via_ir = true },
    { paths = "src/earn/**", optimizer_runs = 200, via_ir = true },
    { paths = "src/intent/**", optimizer_runs = 200, via_ir = true },
    { paths = "src/private/**", optimizer_runs = 200, via_ir = true },
    { paths = "src/loop/**", optimizer_runs = 200, via_ir = true },
]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
number_underscore = "thousands"
