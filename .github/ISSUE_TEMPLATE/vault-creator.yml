name: Open a vault
description: Ask gage to allow an address to create and manage lending vaults on the Intent factory.
title: "[Vault] <who runs it>: <mandate in a few words>"
labels: ["vault-creator"]
body:
  - type: markdown
    attributes:
      value: |
        gage allows the address as a creator on the Intent factory (`IntentFactory.setCreator`). That address then creates its vaults (`IntentFactory.create`), names itself their curator and manages them. Any address works: a wallet or a multisig.
        This issue is intake only. Being allowed is not guaranteed. The issue is closed with the transaction that allowed the address, or with the reason it was not.
        **Never report a vulnerability here:** see [SECURITY.md](https://github.com/DebenLabs/gage-contracts/blob/main/SECURITY.md).
  - type: input
    id: creator
    attributes:
      label: Address to allow as a creator
      description: On Robinhood Chain mainnet (chain ID 4663). It creates the vaults and manages them.
      placeholder: "0x..."
    validations:
      required: true
  - type: textarea
    id: operator
    attributes:
      label: Who runs it
      description: The person, team or company that controls the address, and its public links.
    validations:
      required: true
  - type: input
    id: mandate
    attributes:
      label: Mandate
      description: In a sentence, what the vault lends against and on what terms.
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: Contact
      description: How gage reaches you beyond this issue.
    validations:
      required: true
